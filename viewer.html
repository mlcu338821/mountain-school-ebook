<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>閱讀 — 山野是一所學校</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@300;400&family=Noto+Sans+TC:wght@300;400&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --ink: #1a1612;
    --ink-light: #6b6358;
    --ink-faint: #c8bfb0;
    --paper: #f5f0e8;
    --accent: #4a6741;
    --serif: 'Noto Serif TC', serif;
    --sans: 'Noto Sans TC', sans-serif;
  }

  html, body {
    height: 100%;
    background: var(--ink);
    color: var(--paper);
    font-family: var(--sans);
    overflow: hidden;
    touch-action: none; /* 防止原生縮放與滑動干擾 */
  }

  #topbar {
    position: fixed;
    top: 0; left: 0; right: 0;
    height: 52px;
    background: rgba(26,22,18,0.95);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid rgba(200,191,176,0.15);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 1.5rem;
    z-index: 100;
  }

  .topbar-left { display: flex; align-items: center; gap: 1rem; }

  .back-btn {
    font-size: 0.75rem;
    letter-spacing: 0.1em;
    color: var(--ink-faint);
    text-decoration: none;
    transition: color 0.2s;
  }
  .back-btn:hover { color: var(--paper); }
  .back-btn::before { content: '← '; }

  .divider { width: 1px; height: 16px; background: rgba(200,191,176,0.2); }

  #vol-title {
    font-family: var(--serif);
    font-size: 0.85rem;
    font-weight: 300;
    letter-spacing: 0.1em;
    color: var(--ink-faint);
  }

  #page-info {
    font-size: 0.75rem;
    letter-spacing: 0.1em;
    color: var(--ink-faint);
  }

  #viewer-wrap {
    position: fixed;
    top: 52px; left: 0; right: 0; bottom: 52px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  #book-container { position: relative; }

  /* 手機版滑動容器 */
  #mobile-viewer-wrap {
    display: none;
    width: 100%; height: 100%;
    overflow: hidden;
  }
  .mobile-slider {
    display: flex;
    flex-direction: row; /* 修改：由左往右（左翻書 LTR 邏輯） */
    width: 100%; height: 100%;
    transition: transform 0.3s ease;
  }
  .mobile-slide {
    flex: 0 0 100%;
    width: 100%; height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
  }
  .mobile-slide img {
    max-width: 100%; max-height: 100%;
    object-fit: contain;
    transform-origin: center;
    pointer-events: auto;
  }
  .mobile-slide img.resetting {
    transition: transform 0.3s ease-out;
  }

  #controls {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    height: 52px;
    background: rgba(26,22,18,0.95);
    backdrop-filter: blur(8px);
    border-top: 1px solid rgba(200,191,176,0.15);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 2rem;
    z-index: 100;
  }

  .ctrl-btn {
    background: none;
    border: 1px solid rgba(200,191,176,0.25);
    color: var(--ink-faint);
    width: 36px;
    height: 36px;
    cursor: pointer;
    font-size: 1rem;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
  }
  .ctrl-btn:hover:not(:disabled) { border-color: var(--paper); color: var(--paper); }
  .ctrl-btn:disabled { opacity: 0.2; cursor: default; }
  .ctrl-btn.active { border-color: var(--ink-faint); color: var(--paper); background: rgba(200,191,176,0.1); }

  #progress {
    width: 120px;
    height: 1px;
    background: rgba(200,191,176,0.2);
    position: relative;
  }
  #progress-fill {
    position: absolute;
    left: 0; top: 0; bottom: 0;
    background: var(--ink-faint);
    transition: width 0.3s;
  }

  #loading {
    position: fixed; inset: 0;
    background: var(--ink);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 1rem; z-index: 200;
  }
  #loading-title {
    font-family: var(--serif);
    font-size: 1.1rem; font-weight: 300;
    letter-spacing: 0.2em; color: var(--ink-faint);
  }
  #loading-bar-wrap {
    width: 160px; height: 1px;
    background: rgba(200,191,176,0.15);
    position: relative; overflow: hidden;
  }
  #loading-bar {
    position: absolute; left: -100%; top: 0; bottom: 0; width: 100%;
    background: var(--ink-faint);
    animation: slide 1.2s ease-in-out infinite;
  }
  @keyframes slide { to { left: 100%; } }

  #error {
    display: none; position: fixed; inset: 0;
    background: var(--ink);
    align-items: center; justify-content: center;
    flex-direction: column; gap: 1rem; z-index: 200;
  }
  #error p { color: var(--ink-faint); font-size: 0.85rem; letter-spacing: 0.1em; text-align: center; line-height: 2; }
  #error a { color: var(--ink-faint); }

  #magnifier {
    position: fixed;
    width: 220px; height: 220px;
    border-radius: 50%;
    border: 1.5px solid rgba(200,191,176,0.5);
    box-shadow: 0 4px 24px rgba(0,0,0,0.6);
    overflow: hidden;
    pointer-events: none;
    display: none;
    z-index: 300;
    transform: translate(-50%, -50%);
    background: #000;
  }
  #magnifier canvas { position: absolute; top: 0; left: 0; border-radius: 50%; }

  body.magnifier-on #book-container { cursor: none; }
</style>
</head>
<body>

<div id="loading">
  <div id="loading-title">山野是一所學校</div>
  <div id="loading-bar-wrap"><div id="loading-bar"></div></div>
</div>

<div id="error">
  <p>找不到此期圖片。<br>請確認 issues 資料夾中有對應的圖片檔案。<br><br><a href="index.html">← 返回首頁</a></p>
</div>

<div id="topbar">
  <div class="topbar-left">
    <a class="back-btn" href="index.html">返回首頁</a>
    <div class="divider"></div>
    <div id="vol-title">—</div>
  </div>
  <div id="page-info">—</div>
</div>

<div id="viewer-wrap">
  <div id="book-container"></div>
  <div id="mobile-viewer-wrap"></div>
</div>

<div id="magnifier"><canvas id="mag-canvas" width="220" height="220"></canvas></div>

<div id="controls">
  <button class="ctrl-btn" id="btn-prev" title="上一頁">‹</button>
  <div id="progress"><div id="progress-fill"></div></div>
  <button class="ctrl-btn" id="btn-next" title="下一頁">›</button>
  <button class="ctrl-btn" id="btn-magnifier" title="放大鏡">
    <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
      <circle cx="6.5" cy="6.5" r="4.5"/>
      <line x1="10" y1="10" x2="14" y2="14"/>
    </svg>
  </button>
</div>

<script>
const params = new URLSearchParams(location.search);
const folder = params.get('issue') || '';
const vol = decodeURIComponent(params.get('vol') || '');

document.getElementById('vol-title').textContent = vol || '山野是一所學校';
document.title = (vol || '閱讀') + ' — 山野是一所學校';

const EXTS = ['jpg', 'jpeg', 'png', 'webp'];
let pageFlip = null;
let mobileViewer = null;
let totalPages = 0;

function testImage(url) {
  return new Promise(resolve => {
    const img = new Image();
    img.onload = () => resolve(true);
    img.onerror = () => resolve(false);
    img.src = url;
  });
}

async function findPages() {
  const pages = [];
  let i = 1;
  while (true) {
    const num = String(i).padStart(2, '0');
    let found = false;
    for (const ext of EXTS) {
      const url = `issues/${folder}/page-${num}.${ext}`;
      if (await testImage(url)) { pages.push(url); found = true; break; }
    }
    if (!found) break;
    if (++i > 200) break;
  }
  return pages;
}

function updateUI(currentPage) {
  document.getElementById('page-info').textContent = `第 ${currentPage + 1} 頁 / 共 ${totalPages} 頁`;
  document.getElementById('progress-fill').style.width = ((currentPage + 1) / totalPages * 100) + '%';
  document.getElementById('btn-prev').disabled = currentPage === 0;
  document.getElementById('btn-next').disabled = currentPage >= totalPages - 1;
}

// --- 手機版專屬視圖與觸控邏輯 ---
class MobileViewer {
  constructor(container, pages) {
    this.pages = pages;
    this.currentIndex = 0;
    
    container.style.display = 'block';
    container.innerHTML = `<div class="mobile-slider"></div>`;
    this.slider = container.querySelector('.mobile-slider');

    pages.forEach((url, idx) => {
      const slide = document.createElement('div');
      slide.className = 'mobile-slide';
      const img = document.createElement('img');
      img.src = url;
      img.draggable = false;
      slide.appendChild(img);
      this.slider.appendChild(slide);
      this.bindGestures(slide, img, idx);
    });

    this.updateTransform();
  }

  goTo(index) {
    if (index < 0 || index >= this.pages.length) return;
    this.currentIndex = index;
    this.updateTransform();
    updateUI(this.currentIndex);
    
    // 換頁時重置所有圖片縮放
    this.slider.querySelectorAll('.mobile-slide img').forEach(img => {
      if (parseFloat(img.dataset.scale || 1) > 1) this.resetZoom(img);
    });
  }

  updateTransform() {
    // 修改：左翻書（LTR）負位移
    this.slider.style.transform = `translateX(-${this.currentIndex * 100}%)`;
  }

  resetZoom(img) {
    img.classList.add('resetting');
    img.style.transform = `translate(0px, 0px) scale(1)`;
    img.dataset.scale = 1;
    setTimeout(() => img.classList.remove('resetting'), 300);
  }

  bindGestures(slide, img, index) {
    let scale = 1, tx = 0, ty = 0;
    let initialDist = 0, initialScale = 1;
    let startX = 0, startY = 0;
    let lastTx = 0, lastTy = 0;
    let lastTap = 0;
    let isPinching = false;

    const applyTransform = (s, x, y) => {
      img.style.transform = `translate(${x}px, ${y}px) scale(${s})`;
      img.dataset.scale = s;
    };

    slide.addEventListener('touchstart', (e) => {
      if (e.touches.length === 2) {
        isPinching = true;
        initialDist = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
        initialScale = scale;
      } else if (e.touches.length === 1) {
        startX = e.touches[0].clientX;
        startY = e.touches[0].clientY;
        lastTx = tx;
        lastTy = ty;

        const now = Date.now();
        if (now - lastTap < 300) {
          scale = 1; tx = 0; ty = 0;
          this.resetZoom(img);
          e.preventDefault();
        }
        lastTap = now;
      }
    }, { passive: false });

    slide.addEventListener('touchmove', (e) => {
      e.preventDefault(); // 全面防止原生滑動干擾
      
      if (isPinching && e.touches.length === 2) {
        const dist = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
        scale = Math.max(1, Math.min(initialScale * (dist / initialDist), 5));
        applyTransform(scale, tx, ty);
      } else if (e.touches.length === 1) {
        const dx = e.touches[0].clientX - startX;
        const dy = e.touches[0].clientY - startY;

        if (scale > 1) {
          // 放大的狀態下進行拖曳平移
          tx = lastTx + dx;
          ty = lastTy + dy;
          applyTransform(scale, tx, ty);
        } else {
          // 未放大的狀態下進行左右滑動預覽
          this.slider.style.transition = 'none';
          // 修改：配合左翻書（LTR）計算預覽位移
          this.slider.style.transform = `translateX(calc(-${this.currentIndex * 100}% + ${dx}px))`;
        }
      }
    }, { passive: false });

    slide.addEventListener('touchend', (e) => {
      if (isPinching && e.touches.length < 2) {
        isPinching = false;
      }
      if (!isPinching && scale === 1) {
         const dx = e.changedTouches[0].clientX - startX;
         this.slider.style.transition = 'transform 0.3s ease';
         
         // 修改：根據左翻書（LTR）邏輯：向左滑 (dx < -50) 為下一頁，向右滑 (dx > 50) 為上一頁
         if (dx < -50 && index < this.pages.length - 1) {
           this.goTo(index + 1);
         } else if (dx > 50 && index > 0) {
           this.goTo(index - 1);
         } else {
           this.updateTransform(); // 滑動距離不足，彈回當前頁面
         }
      }
    });
  }
}
// --- 手機版邏輯結束 ---

function initDesktop(pages) {
  const container = document.getElementById('book-container');
  const vw = window.innerWidth;
  const vh = window.innerHeight - 104;
  const PAGE_RATIO = 420 / 297;
  
  let pageH = Math.min(vh * 0.9, 700);
  let pageW = Math.round(pageH / PAGE_RATIO);
  if (pageW * 2 > vw * 0.9) {
    pageW = Math.floor(vw * 0.9 / 2);
    pageH = Math.round(pageW * PAGE_RATIO);
  }

  container.style.width = (pageW * 2) + 'px';
  container.style.height = pageH + 'px';

  pages.forEach((url, idx) => {
    const page = document.createElement('div');
    page.className = 'page';
    const img = document.createElement('img');
    img.src = url;
    img.style.cssText = 'width:100%;height:100%;object-fit:cover;display:block;';
    img.draggable = false;
    page.appendChild(img);
    container.appendChild(page);
  });

  pageFlip = new St.PageFlip(container, {
    width: pageW,
    height: pageH,
    size: 'fixed',
    minWidth: pageW, maxWidth: pageW,
    minHeight: pageH, maxHeight: pageH,
    showCover: true,
    flippingTime: 700,
    usePortrait: false,
    startZIndex: 0,
    autoSize: false,
    clickEventForward: true,
    useMouseEvents: true,
    swipeDistance: 30,
    showPageCorners: true,
    disableFlipByClick: false,
    startPage: 0,
    drawShadow: true,
    direction: 'ltr', // 修改：這裡改為 'ltr' 啟動桌機版左翻書效果
  });

  pageFlip.loadFromHTML(container.querySelectorAll('.page'));
  pageFlip.on('flip', e => updateUI(e.data));
  pageFlip.on('changeState', () => updateUI(pageFlip.getCurrentPageIndex()));

  initMagnifier(container, pageW, pageH);
}

function initMagnifier(container, pageW, pageH) {
  const magnifier = document.getElementById('magnifier');
  const canvas = document.getElementById('mag-canvas');
  const ctx = canvas.getContext('2d');
  const MAG_SIZE = 220;
  const MAG_ZOOM = 2.5;
  let magOn = false;
  let mouseX = 0, mouseY = 0;
  let rafId = null;

  document.getElementById('btn-magnifier').addEventListener('click', () => {
    magOn = !magOn;
    document.getElementById('btn-magnifier').classList.toggle('active', magOn);
    document.body.classList.toggle('magnifier-on', magOn);
    if (!magOn) {
      magnifier.style.display = 'none';
      if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
    }
  });

  container.addEventListener('mousemove', e => {
    if (!magOn) return;
    mouseX = e.clientX;
    mouseY = e.clientY;
    magnifier.style.left = mouseX + 'px';
    magnifier.style.top = mouseY + 'px';
    magnifier.style.display = 'block';
    if (!rafId) drawMagnifier();
  });

  container.addEventListener('mouseleave', () => {
    magnifier.style.display = 'none';
    if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
  });

  function drawMagnifier() {
    rafId = null;
    const rect = container.getBoundingClientRect();
    const halfW = rect.width / 2;
    const fullH = rect.height;
    const relX = mouseX - rect.left;
    const relY = mouseY - rect.top;

    const currentIndex = pageFlip ? pageFlip.getCurrentPageIndex() : 0;
    const isCover = currentIndex === 0;
    
    // 修改：左翻書（LTR）狀態下，右邊是下一頁
    const isNextPage = !isCover && relX > halfW;
    const pageIndex = currentIndex + (isNextPage ? 1 : 0);

    const imgs = container.querySelectorAll('.page img');
    const img = imgs[pageIndex];

    if (!img || !img.complete || img.naturalWidth === 0) {
      rafId = requestAnimationFrame(drawMagnifier);
      return;
    }

    const pageRelX = isNextPage ? relX - halfW : relX;
    const srcX = (pageRelX / halfW) * img.naturalWidth;
    const srcY = (relY / fullH) * img.naturalHeight;

    const pxPerScreen = img.naturalWidth / halfW;
    const srcSize = (MAG_SIZE / MAG_ZOOM) * pxPerScreen;

    const sx = Math.max(0, Math.min(srcX - srcSize / 2, img.naturalWidth - srcSize));
    const sy = Math.max(0, Math.min(srcY - srcSize / 2, img.naturalHeight - srcSize));

    ctx.clearRect(0, 0, MAG_SIZE, MAG_SIZE);
    ctx.save();
    ctx.beginPath();
    ctx.arc(MAG_SIZE / 2, MAG_SIZE / 2, MAG_SIZE / 2, 0, Math.PI * 2);
    ctx.clip();
    ctx.drawImage(img, sx, sy, srcSize, srcSize, 0, 0, MAG_SIZE, MAG_SIZE);
    ctx.restore();
  }
}

function showError() {
  document.getElementById('loading').style.display = 'none';
  document.getElementById('error').style.display = 'flex';
}

async function init() {
  if (!folder) { showError(); return; }
  const pages = await findPages();
  if (!pages.length) { showError(); return; }

  totalPages = pages.length;
  const isMobile = window.innerWidth < 700;

  if (isMobile) {
    document.getElementById('book-container').style.display = 'none';
    document.getElementById('btn-magnifier').style.display = 'none';
    mobileViewer = new MobileViewer(document.getElementById('mobile-viewer-wrap'), pages);
  } else {
    initDesktop(pages);
  }

  document.getElementById('loading').style.display = 'none';
  updateUI(0);
}

// 綁定底部控制按鈕
document.getElementById('btn-prev').addEventListener('click', () => {
  if (pageFlip) pageFlip.flipPrev();
  if (mobileViewer) mobileViewer.goTo(mobileViewer.currentIndex - 1);
});
document.getElementById('btn-next').addEventListener('click', () => {
  if (pageFlip) pageFlip.flipNext();
  if (mobileViewer) mobileViewer.goTo(mobileViewer.currentIndex + 1);
});

// 綁定鍵盤控制
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
    if (pageFlip) pageFlip.flipPrev();
    if (mobileViewer) mobileViewer.goTo(mobileViewer.currentIndex - 1);
  }
  if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
    if (pageFlip) pageFlip.flipNext();
    if (mobileViewer) mobileViewer.goTo(mobileViewer.currentIndex + 1);
  }
});

init();
</script>
</body>
</html>
