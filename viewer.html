<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>閱讀 — 山野是一所學校</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@300;400&family=Noto+Sans+TC:wght@300;400&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --ink: #1a1612;
    --ink-light: #6b6358;
    --ink-faint: #c8bfb0;
    --paper: #f5f0e8;
    --paper-warm: #ede6d6;
    --accent: #4a6741;
    --serif: 'Noto Serif TC', serif;
    --sans: 'Noto Sans TC', sans-serif;
  }

  html, body {
    height: 100%;
    background: var(--ink);
    color: var(--paper);
    font-family: var(--sans);
    overflow: hidden;
  }

  /* top bar */
  #topbar {
    position: fixed;
    top: 0; left: 0; right: 0;
    height: 52px;
    background: rgba(26,22,18,0.95);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid rgba(200,191,176,0.15);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 1.5rem;
    z-index: 100;
  }

  .topbar-left { display: flex; align-items: center; gap: 1rem; }

  .back-btn {
    font-size: 0.75rem;
    letter-spacing: 0.1em;
    color: var(--ink-faint);
    text-decoration: none;
    display: flex;
    align-items: center;
    gap: 0.4rem;
    transition: color 0.2s;
  }
  .back-btn:hover { color: var(--paper); }
  .back-btn::before { content: '←'; }

  .divider { width: 1px; height: 16px; background: rgba(200,191,176,0.2); }

  #vol-title {
    font-family: var(--serif);
    font-size: 0.85rem;
    font-weight: 300;
    letter-spacing: 0.1em;
    color: var(--ink-faint);
  }

  #page-info {
    font-size: 0.75rem;
    letter-spacing: 0.1em;
    color: var(--ink-faint);
  }

  /* viewer area */
  #viewer-wrap {
    position: fixed;
    top: 52px; left: 0; right: 0; bottom: 52px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* 已經移除了遮擋功能列的全螢幕 CSS 設定 */

  #book-container {
    position: relative;
  }

  /* bottom controls */
  #controls {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    height: 52px;
    background: rgba(26,22,18,0.95);
    backdrop-filter: blur(8px);
    border-top: 1px solid rgba(200,191,176,0.15);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 2rem;
    z-index: 100;
  }

  .ctrl-btn {
    background: none;
    border: 1px solid rgba(200,191,176,0.25);
    color: var(--ink-faint);
    width: 36px;
    height: 36px;
    cursor: pointer;
    font-size: 1rem;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
  }
  .ctrl-btn:hover:not(:disabled) {
    border-color: var(--paper);
    color: var(--paper);
  }
  .ctrl-btn:disabled { opacity: 0.2; cursor: default; }
  .ctrl-btn.active {
    border-color: var(--ink-faint);
    color: var(--paper);
    background: rgba(200,191,176,0.1);
  }

  #progress-wrap {
    display: flex;
    align-items: center;
    gap: 0.75rem;
  }
  #progress {
    width: 120px;
    height: 1px;
    background: rgba(200,191,176,0.2);
    position: relative;
  }
  #progress-fill {
    position: absolute;
    left: 0; top: 0; bottom: 0;
    background: var(--ink-faint);
    transition: width 0.3s;
  }

  /* loading */
  #loading {
    position: fixed;
    inset: 0;
    background: var(--ink);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1rem;
    z-index: 200;
  }
  #loading-title {
    font-family: var(--serif);
    font-size: 1.1rem;
    font-weight: 300;
    letter-spacing: 0.2em;
    color: var(--ink-faint);
  }
  #loading-bar-wrap {
    width: 160px;
    height: 1px;
    background: rgba(200,191,176,0.15);
    position: relative;
    overflow: hidden;
  }
  #loading-bar {
    position: absolute;
    left: -100%;
    top: 0; bottom: 0;
    width: 100%;
    background: var(--ink-faint);
    animation: slide 1.2s ease-in-out infinite;
  }
  @keyframes slide { to { left: 100%; } }

  /* error */
  #error {
    display: none;
    position: fixed;
    inset: 0;
    background: var(--ink);
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 1rem;
    z-index: 200;
  }
  #error p { color: var(--ink-faint); font-size: 0.85rem; letter-spacing: 0.1em; text-align: center; line-height: 2; }
  #error a { color: var(--ink-faint); }

  /* 放大鏡 */
  #magnifier {
    position: fixed;
    width: 220px;
    height: 220px;
    border-radius: 50%;
    border: 1.5px solid rgba(200,191,176,0.5);
    box-shadow: 0 4px 24px rgba(0,0,0,0.6), inset 0 0 0 1px rgba(255,255,255,0.05);
    overflow: hidden;
    pointer-events: none;
    display: none;
    z-index: 300;
    transform: translate(-50%, -50%);
    background: #000;
  }
  #magnifier canvas {
    position: absolute;
    top: 0; left: 0;
    border-radius: 50%;
  }

  /* 桌機才有放大鏡游標效果 */
  body.magnifier-on #book-container {
    cursor: none;
  }
</style>
</head>
<body>

<div id="loading">
  <div id="loading-title">山野是一所學校</div>
  <div id="loading-bar-wrap"><div id="loading-bar"></div></div>
</div>

<div id="error">
  <p>找不到此期圖片。<br>請確認 issues 資料夾中有對應的圖片檔案。<br><br><a href="index.html">← 返回首頁</a></p>
</div>

<div id="topbar">
  <div class="topbar-left">
    <a class="back-btn" href="index.html">返回首頁</a>
    <div class="divider"></div>
    <div id="vol-title">—</div>
  </div>
  <div id="page-info">—</div>
</div>

<div id="viewer-wrap">
  <div id="book-container"></div>
</div>

<div id="magnifier"><canvas id="mag-canvas" width="220" height="220"></canvas></div>

<div id="controls">
  <button class="ctrl-btn" id="btn-prev" title="上一頁">‹</button>
  <div id="progress-wrap">
    <div id="progress"><div id="progress-fill"></div></div>
  </div>
  <button class="ctrl-btn" id="btn-next" title="下一頁">›</button>
  <button class="ctrl-btn" id="btn-magnifier" title="放大鏡">
    <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
      <circle cx="6.5" cy="6.5" r="4.5"/>
      <line x1="10" y1="10" x2="14" y2="14"/>
    </svg>
  </button>
  <button class="ctrl-btn" id="btn-fullscreen" title="全螢幕">
    <svg id="icon-enter" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="1,5 1,1 5,1"/>
      <polyline points="11,1 15,1 15,5"/>
      <polyline points="15,11 15,15 11,15"/>
      <polyline points="5,15 1,15 1,11"/>
    </svg>
    <svg id="icon-exit" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="display:none">
      <polyline points="5,1 1,1 1,5"/>
      <polyline points="15,5 15,1 11,1"/>
      <polyline points="11,15 15,15 15,11"/>
      <polyline points="1,11 1,15 5,15"/>
    </svg>
  </button>
</div>

<script>
const params = new URLSearchParams(location.search);
const folder = params.get('issue') || '';
const vol = decodeURIComponent(params.get('vol') || '');

document.getElementById('vol-title').textContent = vol || '山野是一所學校';
document.title = (vol || '閱讀') + ' — 山野是一所學校';

const EXTS = ['jpg', 'jpeg', 'png', 'webp'];

function testImage(url) {
  return new Promise(resolve => {
    const img = new Image();
    img.onload = () => resolve(true);
    img.onerror = () => resolve(false);
    img.src = url;
  });
}

async function findPages() {
  const pages = [];
  let i = 1;
  while (true) {
    const num = String(i).padStart(2, '0');
    let found = false;
    for (const ext of EXTS) {
      const url = `issues/${folder}/page-${num}.${ext}`;
      if (await testImage(url)) {
        pages.push(url);
        found = true;
        break;
      }
    }
    if (!found) break;
    i++;
    if (i > 200) break;
  }
  return pages;
}

let pageFlip = null;
let totalPages = 0;
let isMobile = false;
const PAGE_RATIO = 420 / 297; // A3 橫式

// 【新增】記憶尺寸的變數，用於攔截無效的排版變動
let lastAppliedW = 0;
let lastAppliedH = 0;

function calcSize(availW, availH) {
  let pageW, pageH;
  if (isMobile) {
    pageW = Math.floor(availW * 0.95);
    pageH = Math.round(pageW * PAGE_RATIO);
    if (pageH > availH * 0.95) {
      pageH = Math.floor(availH * 0.95);
      pageW = Math.round(pageH / PAGE_RATIO);
    }
  } else {
    pageH = availH * 0.95;
    pageW = Math.round(pageH / PAGE_RATIO);
    if (pageW * 2 > availW * 0.95) {
      pageW = Math.floor(availW * 0.95 / 2);
      pageH = Math.round(pageW * PAGE_RATIO);
    }
  }
  return { pageW, pageH };
}

// 直接套用容器尺寸，讓 StPageFlip (size: 'stretch') 自動適應
function applySize(availW, availH) {
  // 【關鍵防護】如果尺寸改變小於 2px，表示不是真的調整視窗，直接跳過不重繪！
  if (Math.abs(availW - lastAppliedW) < 2 && Math.abs(availH - lastAppliedH) < 2) {
    return;
  }
  lastAppliedW = availW;
  lastAppliedH = availH;

  const container = document.getElementById('book-container');
  const { pageW, pageH } = calcSize(availW, availH);
  
  container.style.width = (isMobile ? pageW : pageW * 2) + 'px';
  container.style.height = pageH + 'px';
  
  if (pageFlip) {
    pageFlip.update();
  }
}

function updateUI(currentPage) {
  document.getElementById('page-info').textContent = `第 ${currentPage + 1} 頁 / 共 ${totalPages} 頁`;
  document.getElementById('progress-fill').style.width = ((currentPage + 1) / totalPages * 100) + '%';
  document.getElementById('btn-prev').disabled = currentPage === 0;
  document.getElementById('btn-next').disabled = currentPage >= totalPages - 1;
}

async function init() {
  if (!folder) { showError(); return; }

  const pages = await findPages();
  if (!pages.length) { showError(); return; }

  totalPages = pages.length;

  isMobile = window.innerWidth < 700;

  const wrap = document.getElementById('viewer-wrap');
  const container = document.getElementById('book-container');
  
  applySize(wrap.clientWidth, wrap.clientHeight);

  const { pageW, pageH } = calcSize(wrap.clientWidth, wrap.clientHeight);

  const loadedImages = [];

  pages.forEach((url, idx) => {
    const page = document.createElement('div');
    page.className = 'page';
    page.dataset.index = idx;
    const img = document.createElement('img');
    img.src = url;
    img.style.cssText = 'width:100%;height:100%;object-fit:cover;display:block;';
    img.draggable = false;
    loadedImages.push(img);
    page.appendChild(img);
    container.appendChild(page);
  });

  pageFlip = new St.PageFlip(container, {
    width: pageW,
    height: pageH,
    size: 'stretch',
    minWidth: 200,
    maxWidth: 3000,
    minHeight: 200,
    maxHeight: 3000,
    showCover: true,
    flippingTime: 700,
    usePortrait: isMobile,
    startZIndex: 0,
    clickEventForward: true,
    useMouseEvents: true,
    swipeDistance: 30,
    showPageCorners: true,
    disableFlipByClick: false,
    startPage: 0,
    drawShadow: true,
    direction: 'rtl',
    mobileScrollSupport: true,
  });

  pageFlip.loadFromHTML(container.querySelectorAll('.page'));
  pageFlip.on('flip', e => updateUI(e.data));
  pageFlip.on('changeState', () => updateUI(pageFlip.getCurrentPageIndex()));

  document.getElementById('loading').style.display = 'none';
  updateUI(0);

  if (!isMobile) {
    initMagnifier(container, loadedImages, pageW, pageH, isMobile);
  } else {
    document.getElementById('btn-magnifier').style.display = 'none';
    document.getElementById('btn-fullscreen').style.display = 'none';
    initPinchZoom(container);
  }
}

function initPinchZoom(container) {
  let scale = 1;
  let lastScale = 1;
  let originX = 0, originY = 0;
  let translateX = 0, translateY = 0;
  let lastTranslateX = 0, lastTranslateY = 0;

  function getMidpoint(t1, t2) {
    return {
      x: (t1.clientX + t2.clientX) / 2,
      y: (t1.clientY + t2.clientY) / 2
    };
  }
  function getDist(t1, t2) {
    const dx = t1.clientX - t2.clientX;
    const dy = t1.clientY - t2.clientY;
    return Math.sqrt(dx * dx + dy * dy);
  }

  let initDist = 0;
  let initMid = { x: 0, y: 0 };
  let isPinching = false;

  container.addEventListener('touchstart', e => {
    if (e.touches.length === 2) {
      isPinching = true;
      initDist = getDist(e.touches[0], e.touches[1]);
      initMid = getMidpoint(e.touches[0], e.touches[1]);
      lastScale = scale;
      lastTranslateX = translateX;
      lastTranslateY = translateY;
      e.preventDefault();
    }
  }, { passive: false });

  container.addEventListener('touchmove', e => {
    if (!isPinching || e.touches.length !== 2) return;
    e.preventDefault();

    const newDist = getDist(e.touches[0], e.touches[1]);
    const newMid = getMidpoint(e.touches[0], e.touches[1]);

    scale = Math.max(1, Math.min(4, lastScale * (newDist / initDist)));

    translateX = lastTranslateX + (newMid.x - initMid.x);
    translateY = lastTranslateY + (newMid.y - initMid.y);

    applyTransform();
  }, { passive: false });

  container.addEventListener('touchend', e => {
    if (e.touches.length < 2) {
      isPinching = false;
      if (scale <= 1) {
        scale = 1;
        translateX = 0;
        translateY = 0;
        applyTransform();
      }
    }
  });

  let lastTap = 0;
  container.addEventListener('touchend', e => {
    const now = Date.now();
    if (now - lastTap < 300 && e.touches.length === 0) {
      scale = 1;
      translateX = 0;
      translateY = 0;
      applyTransform();
    }
    lastTap = now;
  });

  function applyTransform() {
    container.style.transform = `translate(${translateX}px, ${translateY}px) scale(${scale})`;
    container.style.transformOrigin = 'center center';
    container.style.transition = isPinching ? 'none' : 'transform 0.2s ease';
  }
}

function initMagnifier(container, loadedImages, initPageW, initPageH, isMobile) {
  const magnifier = document.getElementById('magnifier');
  const canvas = document.getElementById('mag-canvas');
  const ctx = canvas.getContext('2d');
  const MAG_SIZE = 220;
  const MAG_ZOOM = 2.5;
  let magOn = false;
  let mouseX = 0, mouseY = 0;
  let rafId = null;

  document.getElementById('btn-magnifier').addEventListener('click', () => {
    magOn = !magOn;
    document.getElementById('btn-magnifier').classList.toggle('active', magOn);
    document.body.classList.toggle('magnifier-on', magOn);
    if (!magOn) {
      magnifier.style.display = 'none';
      if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
    }
  });

  container.addEventListener('mousemove', e => {
    if (!magOn) return;
    mouseX = e.clientX;
    mouseY = e.clientY;
    magnifier.style.left = mouseX + 'px';
    magnifier.style.top = mouseY + 'px';
    magnifier.style.display = 'block';
    if (!rafId) drawMagnifier();
  });

  container.addEventListener('mouseleave', () => {
    magnifier.style.display = 'none';
    if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
  });

  function drawMagnifier() {
    rafId = null;
    const rect = container.getBoundingClientRect();
    const pageW = rect.width / 2;
    const pageH = rect.height;
    const relX = mouseX - rect.left;
    const relY = mouseY - rect.top;

    const currentIndex = pageFlip ? pageFlip.getCurrentPageIndex() : 0;
    const isCover = currentIndex === 0; 
    const isRightPage = !isCover && relX > pageW;
    const pageIndex = currentIndex + (isRightPage ? 1 : 0);
    const imgs = container.querySelectorAll('.page img');
    const img = imgs[pageIndex];

    if (!img || !img.complete || img.naturalWidth === 0) {
      rafId = requestAnimationFrame(drawMagnifier);
      return;
    }

    const pageRelX = isRightPage ? relX - pageW : relX;
    const pageRelY = relY;

    const srcX = (pageRelX / pageW) * img.naturalWidth;
    const srcY = (pageRelY / pageH) * img.naturalHeight;

    const pxPerScreen = img.naturalWidth / pageW; 
    const srcSize = (MAG_SIZE / MAG_ZOOM) * pxPerScreen;

    const sx = Math.max(0, Math.min(srcX - srcSize / 2, img.naturalWidth - srcSize));
    const sy = Math.max(0, Math.min(srcY - srcSize / 2, img.naturalHeight - srcSize));

    ctx.clearRect(0, 0, MAG_SIZE, MAG_SIZE);

    ctx.save();
    ctx.beginPath();
    ctx.arc(MAG_SIZE / 2, MAG_SIZE / 2, MAG_SIZE / 2, 0, Math.PI * 2);
    ctx.clip();

    ctx.drawImage(
      img,
      sx, sy,
      srcSize, srcSize, 
      0, 0,
      MAG_SIZE, MAG_SIZE
    );

    ctx.restore();
  }
}

function showError() {
  document.getElementById('loading').style.display = 'none';
  document.getElementById('error').style.display = 'flex';
}

document.getElementById('btn-prev').addEventListener('click', () => pageFlip && pageFlip.flipPrev());
document.getElementById('btn-next').addEventListener('click', () => {
  if (!pageFlip) return;

  // 針對「桌面版、由右至左 (RTL)、且在第一頁封面」時的套件 Bug 進行修復
  if (!isMobile && pageFlip.getCurrentPageIndex() === 0) {
    const container = document.getElementById('book-container');
    const rect = container.getBoundingClientRect();
    
    // 由於封面被往右推到了畫面中間，書頁真正的左邊緣大約在容器寬度的 1/4 處
    // 我們往內加 20px，確保點擊範圍落在書本的「翻頁感應區」內
    const targetX = rect.left + (rect.width / 4) + 20; 
    const targetY = rect.bottom - 20;

    // 模擬真實的滑鼠點擊，直接點在書頁左下角，強迫套件從正確座標產生翻頁陰影
    const wrapper = container.querySelector('.stf__wrapper') || container;
    wrapper.dispatchEvent(new MouseEvent('click', {
      bubbles: true,
      cancelable: true,
      clientX: targetX,
      clientY: targetY
    }));
  } else {
    // 其他頁面或手機版維持正常呼叫，不受影響
    pageFlip.flipNext();
  }
});

document.addEventListener('keydown', e => {
  if (!pageFlip) return;
  if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') pageFlip.flipPrev();
  if (e.key === 'ArrowRight' || e.key === 'ArrowDown') pageFlip.flipNext();
});

init();

// 【修改】全螢幕切換設定
const btnFs = document.getElementById('btn-fullscreen');
const iconEnter = document.getElementById('icon-enter');
const iconExit = document.getElementById('icon-exit');
const viewerWrap = document.getElementById('viewer-wrap');

btnFs.addEventListener('click', () => {
  if (!document.fullscreenElement) {
    // 【關鍵修改】對整個網頁呼叫全螢幕，這樣才能保留上下功能列！
    document.documentElement.requestFullscreen();
  } else {
    document.exitFullscreen();
  }
});

document.addEventListener('fullscreenchange', () => {
  const isFs = !!document.fullscreenElement;
  btnFs.classList.toggle('active', isFs);
  iconEnter.style.display = isFs ? 'none' : '';
  iconExit.style.display = isFs ? '' : 'none';
  viewerWrap.classList.toggle('is-fullscreen', isFs);
  
  // 【關鍵修改】優雅的重新定位動畫，避免縮放時破圖閃爍
  const container = document.getElementById('book-container');
  container.style.transition = 'none';
  container.style.opacity = '0';
  
  setTimeout(() => {
    if (pageFlip) {
      pageFlip.update(); 
    }
    container.style.transition = 'opacity 0.2s ease';
    container.style.opacity = '1';
  }, 250);
});

// 【修改】單純乾淨的尺寸監聽器
const resizeObserver = new ResizeObserver(entries => {
  for (const entry of entries) {
    const { width, height } = entry.contentRect;
    if (width > 0 && height > 0) {
      applySize(width, height);
    }
  }
});

resizeObserver.observe(viewerWrap);
</script>
</body>
</html>
