<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>閱讀 — 山野是一所學校</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@300;400&family=Noto+Sans+TC:wght@300;400&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --ink: #1a1612;
    --ink-light: #6b6358;
    --ink-faint: #c8bfb0;
    --paper: #f5f0e8;
    --paper-warm: #ede6d6;
    --accent: #4a6741;
    --serif: 'Noto Serif TC', serif;
    --sans: 'Noto Sans TC', sans-serif;
  }

  html, body { height: 100%; background: var(--ink); color: var(--paper); font-family: var(--sans); overflow: hidden; }

  #topbar { position: fixed; top: 0; left: 0; right: 0; height: 52px; background: rgba(26,22,18,0.95); backdrop-filter: blur(8px); border-bottom: 1px solid rgba(200,191,176,0.15); display: flex; align-items: center; justify-content: space-between; padding: 0 1.5rem; z-index: 100; }
  .topbar-left { display: flex; align-items: center; gap: 1rem; }
  .back-btn { font-size: 0.75rem; letter-spacing: 0.1em; color: var(--ink-faint); text-decoration: none; display: flex; align-items: center; gap: 0.4rem; transition: color 0.2s; }
  .back-btn:hover { color: var(--paper); }
  .back-btn::before { content: '←'; }
  .divider { width: 1px; height: 16px; background: rgba(200,191,176,0.2); }
  #vol-title { font-family: var(--serif); font-size: 0.85rem; font-weight: 300; letter-spacing: 0.1em; color: var(--ink-faint); }
  #page-info { font-size: 0.75rem; letter-spacing: 0.1em; color: var(--ink-faint); }

  #viewer-wrap { position: fixed; top: 52px; left: 0; right: 0; bottom: 52px; display: flex; align-items: center; justify-content: center; }
  #book-container { position: relative; }

  #controls { position: fixed; bottom: 0; left: 0; right: 0; height: 52px; background: rgba(26,22,18,0.95); backdrop-filter: blur(8px); border-top: 1px solid rgba(200,191,176,0.15); display: flex; align-items: center; justify-content: center; gap: 2rem; z-index: 100; }
  .ctrl-btn { background: none; border: 1px solid rgba(200,191,176,0.25); color: var(--ink-faint); width: 36px; height: 36px; cursor: pointer; font-size: 1rem; display: flex; align-items: center; justify-content: center; transition: all 0.2s; }
  .ctrl-btn:hover:not(:disabled) { border-color: var(--paper); color: var(--paper); }
  .ctrl-btn:disabled { opacity: 0.2; cursor: default; }
  
  #progress-wrap { display: flex; align-items: center; gap: 0.75rem; }
  #progress { width: 120px; height: 1px; background: rgba(200,191,176,0.2); position: relative; }
  #progress-fill { position: absolute; left: 0; top: 0; bottom: 0; background: var(--ink-faint); transition: width 0.3s; }

  #loading { position: fixed; inset: 0; background: var(--ink); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1rem; z-index: 200; }
  #magnifier { position: fixed; width: 220px; height: 220px; border-radius: 50%; border: 1.5px solid rgba(200,191,176,0.5); box-shadow: 0 4px 24px rgba(0,0,0,0.6); overflow: hidden; pointer-events: none; display: none; z-index: 300; transform: translate(-50%, -50%); background: #000; }
  #magnifier canvas { position: absolute; top: 0; left: 0; border-radius: 50%; }
  body.magnifier-on #book-container { cursor: none; }
</style>
</head>
<body>

<div id="loading">
  <div style="font-family: var(--serif); color: var(--ink-faint);">山野是一所學校</div>
</div>

<div id="topbar">
  <div class="topbar-left">
    <a class="back-btn" href="index.html">返回首頁</a>
    <div class="divider"></div>
    <div id="vol-title">—</div>
  </div>
  <div id="page-info">—</div>
</div>

<div id="viewer-wrap">
  <div id="book-container"></div>
</div>

<div id="magnifier"><canvas id="mag-canvas" width="220" height="220"></canvas></div>

<div id="controls">
  <button class="ctrl-btn" id="btn-prev" title="上一頁">‹</button>
  <div id="progress-wrap">
    <div id="progress"><div id="progress-fill"></div></div>
  </div>
  <button class="ctrl-btn" id="btn-next" title="下一頁">›</button>
  <button class="ctrl-btn" id="btn-magnifier" title="放大鏡">
    <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
      <circle cx="6.5" cy="6.5" r="4.5"/><line x1="10" y1="10" x2="14" y2="14"/>
    </svg>
  </button>
</div>

<script>
const params = new URLSearchParams(location.search);
const folder = params.get('issue') || '';
const vol = decodeURIComponent(params.get('vol') || '');

document.getElementById('vol-title').textContent = vol || '山野是一所學校';
document.title = (vol || '閱讀') + ' — 山野是一所學校';

const EXTS = ['jpg', 'jpeg', 'png', 'webp'];
async function testImage(url) {
  return new Promise(resolve => { const img = new Image(); img.onload = () => resolve(true); img.onerror = () => resolve(false); img.src = url; });
}

async function findPages() {
  const pages = [];
  for (let i = 1; i <= 200; i++) {
    const num = String(i).padStart(2, '0');
    let found = false;
    for (const ext of EXTS) {
      const url = `issues/${folder}/page-${num}.${ext}`;
      if (await testImage(url)) { pages.push(url); found = true; break; }
    }
    if (!found) break;
  }
  return pages;
}

let pageFlip = null, totalPages = 0, isMobile = false;
const PAGE_RATIO = 420 / 297;

function applySize(availW, availH) {
  const container = document.getElementById('book-container');
  let pageW, pageH;
  if (isMobile) {
    pageW = Math.floor(availW * 0.95); pageH = Math.round(pageW * PAGE_RATIO);
  } else {
    pageH = availH * 0.95; pageW = Math.round(pageH / PAGE_RATIO);
    if (pageW * 2 > availW * 0.95) { pageW = Math.floor(availW * 0.95 / 2); pageH = Math.round(pageW * PAGE_RATIO); }
  }
  container.style.width = (isMobile ? pageW : pageW * 2) + 'px';
  container.style.height = pageH + 'px';
  if (pageFlip) pageFlip.update();
}

function updateUI(currentPage) {
  document.getElementById('page-info').textContent = `第 ${currentPage + 1} 頁 / 共 ${totalPages} 頁`;
  document.getElementById('progress-fill').style.width = ((currentPage + 1) / totalPages * 100) + '%';
  document.getElementById('btn-prev').disabled = currentPage === 0;
  document.getElementById('btn-next').disabled = currentPage >= totalPages - 1;
}

async function init() {
  if (!folder) return;
  const pages = await findPages();
  totalPages = pages.length;
  isMobile = window.innerWidth < 700;
  const container = document.getElementById('book-container');
  
  pages.forEach((url, idx) => {
    const page = document.createElement('div');
    page.className = 'page';
    page.innerHTML = `<img src="${url}" style="width:100%;height:100%;object-fit:cover;display:block;">`;
    container.appendChild(page);
  });

  pageFlip = new St.PageFlip(container, {
    width: 420, height: 297, size: 'stretch', showCover: true, 
    usePortrait: isMobile, direction: 'rtl',
  });
  pageFlip.loadFromHTML(container.querySelectorAll('.page'));
  pageFlip.on('flip', e => updateUI(e.data));
  
  document.getElementById('loading').style.display = 'none';
  updateUI(0);
}

document.getElementById('btn-prev').addEventListener('click', () => pageFlip.flipPrev());
document.getElementById('btn-next').addEventListener('click', () => pageFlip.flipNext());
init();
</script>
</body>
</html>
